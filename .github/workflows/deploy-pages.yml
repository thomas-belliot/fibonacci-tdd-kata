name: Deploy notebook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    working-directory: fibonacci-tdd-kata

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Build Fibonacci package
        run: uv build

      - name: Prepare WASM package
        run: |
          mkdir -p notebooks/public
          cp dist/fibonacci_tdd_kata-*.whl notebooks/public/

      - name: Export notebook to WASM-powered HTML
        run: |
          uv run marimo export html-wasm \
            notebooks/fibonacci_explorer.py \
            -o site \
            --mode run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fibonacci-tdd-kata/site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
