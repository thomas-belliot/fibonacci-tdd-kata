name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    defaults:
      run:
        working-directory: fibonacci-tdd-kata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff version
        run: uv run --locked ruff --version

      - name: Lint
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked pytest --cov=src/fibonacci_tdd_kata --cov-report=term-missing
