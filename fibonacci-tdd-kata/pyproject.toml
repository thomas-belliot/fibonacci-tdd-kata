[project]
name = "fibonacci-tdd-kata"
version = "0.1.0"
description = "A TDD kata: Fibonacci, from notebook exploration to a tested, published package"
readme = "README.md"
authors = [
    { name = "Thomas Belliot", email = "thomas.belliot@centrale.centralelille.fr" }
]
requires-python = ">=3.12"
dependencies = [
  "matplotlib",
  "numpy",
]

[project.scripts]
fibonacci-tdd-kata = "fibonacci_tdd_kata:main"
fibonacci-kata = "fibonacci_tdd_kata.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pyflakes, pycodestyle, isort, pyupgrade, bugbear

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 60

[tool.marimo.runtime]
pythonpath = ["src"]